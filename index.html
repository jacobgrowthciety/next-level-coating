<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L4NWQZL2FK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L4NWQZL2FK');
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Brand display/script faces are now self-hosted from /fonts (see src/index.css):
         Microgramma D Extended = bold extended display, Third Rail = brush/marker script.
         These replaced the Anton / Permanent Marker Google Fonts stand-ins, which are no
         longer requested at all now that the real files are in hand.

         Microgramma Bold is preloaded because it renders the H1/nav — the most visible text
         on first paint — so the swap happens before the user sees a fallback. crossorigin is
         REQUIRED on font preloads even same-origin: fonts are fetched in CORS mode, and a
         preload without it is treated as a separate cache entry, double-fetching the file. -->
    <link
      rel="preload"
      as="font"
      type="font/otf"
      href="/fonts/MicrogrammaD-ExtendedBold.otf"
      crossorigin
    />
    <!-- Plus Jakarta Sans (site-wide body font, §2) stays on Google Fonts; weights 400/500/600
         cover font-normal, font-medium, font-semibold usage across the site. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- No static <title> or <meta name="description"> here on purpose — every route sets its
         own via react-helmet-async (see src/components/Seo.tsx). react-helmet-async only
         manages tags it creates itself; it does not adopt/replace a pre-existing static tag,
         it inserts its own alongside it. A static tag here would produce two <title>/<meta
         description> elements per page (confirmed — this is what was happening before this
         comment was added), with crawlers/validators liable to read whichever one comes first
         in the DOM instead of the real per-page one. Modern crawlers execute JS before
         indexing, so the brief pre-hydration gap (blank tab title until React mounts) is an
         accepted tradeoff for this client-only SPA. -->

    <!-- Static Open Graph / Twitter card — homepage values.
         =========================================================================================
         WHY THESE ARE STATIC WHEN <title> DELIBERATELY IS NOT (see the note above):
         search crawlers execute JS, so they pick up the per-route tags react-helmet-async writes.
         Social/link-unfurl scrapers (iMessage, Facebook, WhatsApp, Slack…) do NOT run JS, so they
         only ever see this file. Without these tags a shared link renders as a bare URL with no
         card at all — which is exactly what was happening.

         Yes, helmet also emits its own og:* on top of these, so the live DOM ends up with two of
         each. That is harmless in a way a duplicate <title> was not: browsers don't render og
         tags, and the scrapers that read them never get as far as running helmet.

         SCOPE: every route is served this same index.html, so these homepage values are what a
         scraper sees for /garage-flooring, /about and friends too. A branded homepage card beats
         no card, but it is not per-page accurate. Per-page previews for static routes would need
         the same server-side treatment /blog/:slug already gets in middleware.ts.

         og:image MUST be an absolute URL on the canonical domain — scrapers cannot resolve a
         relative path. hero-poster.jpg is 1920x1080 (1.78:1) against the 1200x630 (1.91:1) that
         Facebook recommends; close enough that it is used as-is rather than re-cropped, and it is
         comfortably over the 1200px minimum width. It is the same default the Seo component uses,
         so the static and JS-rendered cards agree. Declaring width/height lets a scraper lay the
         card out without downloading the file first. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Next Level Coatings" />
    <meta property="og:url" content="https://www.nextlevelcoatingsaz.com/" />
    <meta
      property="og:title"
      content="Next Level Coatings | Arizona's Top Concrete Coatings Specialists"
    />
    <meta
      property="og:description"
      content="Arizona's top-rated concrete coating specialists — garage floors, patios, driveways &amp; pool decks. 1-day installs, lifetime warranty. Free quotes."
    />
    <meta property="og:image" content="https://www.nextlevelcoatingsaz.com/hero-poster.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta
      property="og:image:alt"
      content="Next Level Coatings installer broadcasting flake across a freshly coated Arizona garage floor"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Next Level Coatings | Arizona's Top Concrete Coatings Specialists"
    />
    <meta
      name="twitter:description"
      content="Arizona's top-rated concrete coating specialists — garage floors, patios, driveways &amp; pool decks. 1-day installs, lifetime warranty. Free quotes."
    />
    <meta name="twitter:image" content="https://www.nextlevelcoatingsaz.com/hero-poster.jpg" />
    <meta
      name="twitter:image:alt"
      content="Next Level Coatings installer broadcasting flake across a freshly coated Arizona garage floor"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
